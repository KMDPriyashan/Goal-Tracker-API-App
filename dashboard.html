<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashbord - Goal Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary stricky-top">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand fw-bold">🔥 Goal Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="dashboard.html" class="nav-link active"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="goals.html"><i class="bi bi-bullseye"></i> Goals</a></li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html"><i class="bi bi-check2-square"></i> Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="bi bi-bell"></i> Remainders</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
                    <li class="nav-item"><a class="nav-link text-denger" href="#" onclick="logoutUser()"><i class="bi bi-box-arrow-right"></i> LogOut</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="col-12">
            <h2>💎 Dashboard</h2>
            <p class="text-muted" id="welcomeMessage">Welcome Back..!</p>
        </div>
        <!-- then must be developemed things -->
    </div>

    <!-- Statiscic code -->
     <div class="row g-4 mb-4">
        <div class="col-mb-3 col-sm-6">
            <div class="card border-0 shadow-sm hover-card">
                <div class="card-body text-center py-4">
                    <div class="display-4 text-primary" id="totalGoals">0</div>
                    <h6 class="text-muted mb-0">Total Goals</h6>
                    <small class="text-success" id="goalProgress">0 % Complete</small>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card-border-0 shadow-sm hover-card">
                <div class="card-body text-center py-4">
                    <div class="display-4 text-success" id="completedGoals">0</div>
                    <h6 class="text-muted mb-0">Completed Goals</h6>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card-border-0 shadow-sm hover-card">
                <div class="card-body text-center py-4">
                    <div class="display-4 text-warning" id="pendingTask">0</div>
                    <h6 class="text-muted mb-0">Pending Tasks</h6>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="card-border-0 shadow-sm hover-card">
                <div class="card-body text-center py-4">
                    <div class="display-4 text-info" id="totalTasks">0</div>
                    <h6 class="text-muted mb-0">Total Tasks</h6>
                </div>
            </div>
        </div>
     </div>

     <!-- Quick action and activity -->

</body>
</html>
