<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Goal Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Style/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">🎯 Goal Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="goals.html"><i class="bi bi-bullseye"></i> Goals</a></li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html"><i class="bi bi-check2-square"></i> Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="bi bi-bell"></i> Reminders</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
                    <li class="nav-item fw-bold"><a class="nav-link text-dark fw-bold" href="#" onclick="logoutUser()"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alertContainer"></div>
        
        <!-- Welcome Section -->
        <div class="row mb-4">
            <div class="col-12">
                <h2>📊 Dashboard</h2>
                <p class="text-muted" id="welcomeMessage">Welcome back!</p>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-3 col-sm-6">
                <div class="card border-0 shadow-sm hover-card">
                    <div class="card-body text-center py-4">
                        <div class="display-4 text-primary" id="totalGoals">0</div>
                        <h6 class="text-muted mb-0">Total Goals</h6>
                        <small class="text-success" id="goalProgress">0% Complete</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card border-0 shadow-sm hover-card">
                    <div class="card-body text-center py-4">
                        <div class="display-4 text-success" id="completedGoals">0</div>
                        <h6 class="text-muted mb-0">Completed Goals</h6>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card border-0 shadow-sm hover-card">
                    <div class="card-body text-center py-4">
                        <div class="display-4 text-warning" id="pendingTasks">0</div>
                        <h6 class="text-muted mb-0">Pending Tasks</h6>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card border-0 shadow-sm hover-card">
                    <div class="card-body text-center py-4">
                        <div class="display-4 text-info" id="totalTasks">0</div>
                        <h6 class="text-muted mb-0">Total Tasks</h6>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions & Activity -->
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent border-0">
                        <h5 class="mb-0">⚡ Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <a href="add-goal.html" class="btn btn-primary w-100 mb-2">
                            <i class="bi bi-plus-circle"></i> Create New Goal
                        </a>
                        <a href="add-task.html" class="btn btn-success w-100 mb-2">
                            <i class="bi bi-plus-circle"></i> Create New Task
                        </a>
                        <a href="add-reminder.html" class="btn btn-warning w-100">
                            <i class="bi bi-plus-circle"></i> Set Reminder
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent border-0">
                        <h5 class="mb-0">🔄 Recent Activity</h5>
                    </div>
                    <div class="card-body" id="activityContainer">
                        <div class="text-center text-muted py-4">
                            <div class="spinner-border" role="status"></div>
                            <p class="mt-2">Loading activity...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        
    </script>
</body>
</html>
