<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - goal tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                        <h1 class="mb-0">🔥 Goal Tracker</h1>
                        <p class="mb-0 small">Track your goal and achived more..!</p>
                    </div>
                    <div class="card-body p-4">
                        <div id="alertContainer"></div>
                        <form id="registerform">
                            <div>
                            <label for="username" class="form-label fw-bold">Username</label>
                                <input type="text" id="username" class="form-control" placeholder="Choose a username" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Email Address</label>
                                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-bold">Confirm Password</label>
                                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Register</button>
                        </form>
                        <p class="text-center mt-3">Already have an Account? <a href="login.html" class="fw-bold">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JavaScript/auth.js"></script>
    <script src="JavaScript/config.js"></script>
    <script src="JavaScript/utils.js"></script>

    <script>
        if (isLoggedIn()) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (!username || !email || !password || !confirmPassword) {
                showAlert('danger', 'Please fill in all fields');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('danger', 'Passwords do not match!');
                return;
            }

            if (password.length < 6) {
                showAlert('danger', 'Password must be at least 6 characters');
                return;
            }

            const result = await registerUser({ username, email, password });
            if (result && result.result === true) {
                window.location.href = 'login.html';
            }
        });
    </script>
    
</body>
</html>
