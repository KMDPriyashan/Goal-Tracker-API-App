<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Goal - Goal Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Style/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">🎯 Goal Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i>
                            Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="goals.html"><i class="bi bi-bullseye"></i> Goals</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html"><i class="bi bi-check2-square"></i>
                            Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="bi bi-bell"></i>
                            Reminders</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person"></i>
                            Profile</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logoutUser()"><i
                                class="bi bi-box-arrow-right"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alertContainer"></div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent border-0">
                        <h4 class="mb-0">✏️ Edit Goal</h4>
                    </div>
                    <div class="card-body">
                        <form id="editGoalForm">
                            <input type="hidden" id="goalId">
                            <div class="mb-3">
                                <label for="goalName" class="form-label fw-bold">Goal Name *</label>
                                <input type="text" id="goalName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label fw-bold">Description</label>
                                <textarea id="description" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="targetDate" class="form-label fw-bold">Target Date *</label>
                                <input type="date" id="targetDate" class="form-control" required>
                            </div>

                            <hr>
                            <h5 class="mb-3">📌 Milestones</h5>
                            <div id="milestonesContainer"></div>
                            <button type="button" id="addMilestone" class="btn btn-outline-secondary btn-sm mb-3">
                                <i class="bi bi-plus-circle"></i> Add Milestone
                            </button>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary py-2 fw-bold">Update Goal</button>
                                <a href="goals.html" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/goals.js"></script>

    <script>
        if (!isLoggedIn()) {
            window.location.href = 'login.html';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const goalId = urlParams.get('id');

        if (!goalId) {
            window.location.href = 'goals.html';
        }

        // Load goal data
        loadGoalForEdit(goalId);

        // Add milestone (same as add-goal.html)
        document.getElementById('addMilestone').addEventListener('click', function () {
            const container = document.getElementById('milestonesContainer');
            const newMilestone = document.createElement('div');
            newMilestone.className = 'milestone-item border p-3 rounded mb-2';
            newMilestone.innerHTML = `
                <div class="row">
                    <div class="col-md-5">
                        <input type="text" class="form-control form-control-sm milestone-name" placeholder="Milestone name" required>
                        <input type="hidden" class="milestone-id" value="0">
                    </div>
                    <div class="col-md-5">
                        <input type="date" class="form-control form-control-sm milestone-date" placeholder="Due date">
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-danger btn-sm remove-milestone">✕</button>
                    </div>
                </div>
            `;
            container.appendChild(newMilestone);

            newMilestone.querySelector('.remove-milestone').addEventListener('click', function () {
                this.closest('.milestone-item').remove();
            });
        });

        // Edit form submit
        document.getElementById('editGoalForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const goalId = document.getElementById('goalId').value;
            const goalName = document.getElementById('goalName').value.trim();
            const description = document.getElementById('description').value.trim();
            const targetDate = document.getElementById('targetDate').value;

            if (!goalName || !targetDate) {
                showAlert('danger', 'Please fill in all required fields');
                return;
            }

            // Collect milestones
            const milestoneItems = document.querySelectorAll('.milestone-item');
            const milestones = [];
            milestoneItems.forEach(item => {
                const name = item.querySelector('.milestone-name').value.trim();
                const dueDate = item.querySelector('.milestone-date').value;
                const id = parseInt(item.querySelector('.milestone-id')?.value || '0');
                if (name) {
                    milestones.push({
                        id: id,
                        milestoneName: name,
                        description: '',
                        dueDate: dueDate || null
                    });
                }
            });

            const goalData = {
                id: parseInt(goalId),
                userId: parseInt(getUserId()),
                goalName: goalName,
                description: description || '',
                targetDate: targetDate + 'T00:00:00',
                milestones: milestones
            };

            const result = await updateGoal(goalId, goalData);
            if (result && result.result === true) {
                window.location.href = 'goals.html';
            }
        });




    </script>


</body>

</html>
