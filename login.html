<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - goal tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                        <h1 class="mb-0">🔥 Goal Tracker</h1>
                        <p class="mb-0 small">Track your goal and achived more..!</p>
                    </div>
                    <div class="card-body p-4">
                        <div id="alertContainer"></div>
                        <form action="Loginform" id="loginform">
                            <div class="mb-3">
                                <label for="username" class="form-lable fw-bold">Username</label>
                                <input type="text" id="username" class="form-control" placeholder="Enter Your Username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-lable fw-bold">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="Enter Your Password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Login</button>
                        </form>
                        <p class="text-center mt-3">Don't have an account? <a href="register.html" class="fw-bold">Register here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JavaScript/auth.js"></script>
    <script src="JavaScript/config.js"></script>
    <script src="JavaScript/utils.js"></script>

    <script>
        if (isLoggedIn()) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showAlert('danger', 'Please fill in all fields');
                return;
            }

            const result = await loginUser({ username, password });
            if (result && result.result === true) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
    
</body>
</html>
