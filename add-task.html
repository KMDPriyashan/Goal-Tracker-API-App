<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task - Goal Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Style/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">🎯 Goal Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i>
                            Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="goals.html"><i class="bi bi-bullseye"></i> Goals</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html"><i class="bi bi-check2-square"></i>
                            Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="bi bi-bell"></i>
                            Reminders</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person"></i>
                            Profile</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logoutUser()"><i
                                class="bi bi-box-arrow-right"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alertContainer"></div>

        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent border-0">
                        <h4 class="mb-0">➕ Create New Task</h4>
                    </div>
                    <div class="card-body">
                        <form id="taskForm">
                            <div class="mb-3">
                                <label for="taskName" class="form-label fw-bold">Task Name *</label>
                                <input type="text" id="taskName" class="form-control" placeholder="Enter task name"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label fw-bold">Description</label>
                                <textarea id="description" class="form-control" rows="3"
                                    placeholder="Task description"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="frequency" class="form-label fw-bold">Frequency *</label>
                                <select id="frequency" class="form-select" required>
                                    <option value="Daily">Daily</option>
                                    <option value="Weekly">Weekly</option>
                                    <option value="Monthly">Monthly</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="startDate" class="form-label fw-bold">Start Date</label>
                                    <input type="date" id="startDate" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dueDate" class="form-label fw-bold">Due Date</label>
                                    <input type="date" id="dueDate" class="form-control">
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success py-2 fw-bold">Create Task</button>
                                <a href="tasks.html" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/tasks.js"></script>

    <script>

        if (!isLoggedIn()) {
            window.location.href = 'login.html';
        }

        const today = new Date().toISOString().split('T')[0];
        const future = new Date();
        future.setDate(future.getDate() + 7);
        document.getElementById('startDate').value = today;
        document.getElementById('dueDate').value = future.toISOString().split('T')[0];

        document.getElementById('taskForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const taskName = document.getElementById('taskName').value.trim();
            const description = document.getElementById('description').value.trim();
            const frequency = document.getElementById('frequency').value;
            const startDate = document.getElementById('startDate').value;
            const dueDate = document.getElementById('dueDate').value;

            if (!taskName) {
                showAlert('danger', 'Please enter a task name');
                return;
            }

            const taskData = {
                userId: parseInt(getUserId()),
                taskName: taskName,
                description: description || '',
                frequency: frequency,
                startDate: startDate ? startDate + 'T00:00:00' : null,
                dueDate: dueDate ? dueDate + 'T00:00:00' : null
            };

            const result = await createTask(taskData);
            if (result && result.result === true) {
                window.location.href = 'tasks.html';
            }
        });




    </script>

</body>

</html>
