<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Goal - Goal Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Style/style.css">
</head>

<body>
    <!-- Navbar Section -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">🎯 Goal Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html"><i
                                class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="goals.html"><i class="bi bi-bullseye"></i> Goals</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html"><i class="bi bi-check2-square"></i>
                            Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="bi bi-bell"></i>
                            Reminders</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person"></i>
                            Profile</a></li>
                    <li class="nav-item fw-bold"><a class="nav-link text-dark fw-bold" href="#"
                            onclick="logoutUser()"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alertContainer"></div>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent border-0">
                        <h4 class="mb-0">🔥 Create New Goal</h4>
                    </div>
                    <div class="card-body">
                        <form action="goalform" id="goalForm">
                            <div class="mb-3">
                                <label for="goalname" class="form-label fw-bold">Goal Name</label>
                                <input type="text" id="goalname" class="form-control" placeholder="Enter Goal Name"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label fw-bold">Description</label>
                                <textarea name="description" id="description" class="form-control" rows="3"
                                    placeholder="Describe Your Goal"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="targetDate" class="form-label fw-bold">Target Date</label>
                                <input type="date" id="targetDate" class="form-control" required>
                            </div>

                            <hr>
                            <h5 class="mb-3">📌 Milestones</h5>
                            <div id="milestonesContainer">
                                <div class="milestone-items border p-3 rounded mb-2">
                                    <div class="row">
                                        <div class="col-mb-5 mt">
                                            <input type="text" class="form-control form-control-sm milestone-name"
                                                placeholder="Milestone Name" required>
                                        </div>
                                        <div class="col-mb-5 mt-3">
                                            <input type="date" class="form-control form-control-sm milestone-date"
                                                placeholder="Due Date">
                                        </div>
                                        <div class="col-mb-2">
                                            <button type="button"
                                                class="btn btn-danger btn-sm remove-milstone mt-2">❌</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button type="button" id="addMilestone" class="btn btn-outline-secondary btn-sm mb-3">
                                <i class="bi bi-plus-circle"></i> Add Milstone
                            </button>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary py-2 fw-bold">Create Goal</button>
                                <a href="goals.html" class="btn btn-outline-secondary">Cancel</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/goals.js"></script>

    <script>
        if (!isLoggedIn()) {
            window.location.href = 'login.html';
        }
        const defaultDate = new Date();
        defaultDate.setDate(defaultDate.getDate() + 30);
        document.getElementById('targetDate').value = defaultDate.toISOString().split('T')[0];

        //add milstone
        document.getElementById('addMilestone').addEventListener('click', function () {
            const container = document.getElementById('milestonesContainer');
            const newMilestone = document.createElement('div');
            newMilestone.className = 'milestone-item border p-3 rounded mb-2';
            newMilestone.innerHTML = `
            <div class="row">
                    <div class="col-md-5">
                        <input type="text" class="form-control form-control-sm milestone-name" placeholder="Milestone name" required>
                    </div>
                    <div class="col-md-5">
                        <input type="date" class="form-control form-control-sm milestone-date" placeholder="Due date">
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-danger btn-sm remove-milestone">✕</button>
                    </div>
                </div>
            `;
            container.appendChild(newMilestone);

            //add remove event to new milestone
            newMilestone.querySelector('.remove-milestone').addEventListener('click', function(){
                if(document.querySelectorAll('.milestone-item').length > 1){
                    this.closest('.milestone-item').remove();
                }else{
                    showAlert('warning.. ', 'You need to ate leaset one milestone.');
                }
            })

        })

    </script>


</body>

</html>
