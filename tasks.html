<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task - Goal Trcker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Style/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">🎯 Goal Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="goals.html"><i class="bi bi-bullseye"></i> Goals</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tasks.html"><i class="bi bi-check2-square"></i> Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="bi bi-bell"></i> Reminders</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person"></i> Profile</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logoutUser()"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

     <div class="container mt-4">
        <div id="alertContainer"></div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📋 My Tasks</h2>
            <a href="add-task.html" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> New Task
            </a>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" id="searchTask" class="form-control" placeholder="Search tasks...">
            </div>
            <div class="col-md-3">
                <select id="filterFrequency" class="form-select">
                    <option value="all">All Frequencies</option>
                    <option value="Daily">Daily</option>
                    <option value="Weekly">Weekly</option>
                    <option value="Monthly">Monthly</option>
                </select>
            </div>
            <div class="col-md-2">
                <button id="showCompleted" class="btn btn-outline-secondary w-100">
                    <i class="bi bi-eye"></i> Show All
                </button>
            </div>
        </div>

        <div id="tasksContainer">
            <div class="text-center py-5">
                <div class="spinner-border" role="status"></div>
                <p class="mt-2 text-muted">Loading tasks...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/tasks.js"></script>

    <script>
        
    </script>
    


</body>
</html>
